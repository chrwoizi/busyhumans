<div><div class="PreferencesP-title">Preferences</div> {% if not viewer.logged_in %}<div class="PreferencesP-denied">Please login.</div>{% else %}<div><div class="PreferencesP-subtitle">Notifications:</div> <span class="PreferencesP-checkbox"><input type="checkbox" id="pref-subscribe"{% if viewer.account.subscribe_own_assignments %} checked{% endif %}><label for="pref-subscribe">Automatically subscribe to my new assignments.</label></span> <div><div class="PreferencesP-notify">Notify me when:</div> <div class="PreferencesP-indent"> <span class="PreferencesP-checkbox"><input type="checkbox" id="pref-activity"{% if viewer.account.notify_other_activity %} checked{% endif %}><label for="pref-activity">Somebody creates an activity for my subscribed assignments.</label></span> <span class="PreferencesP-checkbox"><input type="checkbox" id="pref-activity-reward"{% if viewer.account.notify_activity_reward %} checked{% endif %}><label for="pref-activity-reward">I get XP for my activities.</label></span> <span class="PreferencesP-checkbox"><input type="checkbox" id="pref-other-activity-reward"{% if viewer.account.notify_other_activity_reward %} checked{% endif %}><label for="pref-other-activity-reward">I get XP for my assignments.</label></span> </div></div> <div class="PreferencesP-subtitle">Email address:</div> <span class="PreferencesP-checkbox"><input type="checkbox" id="change-email"><label for="change-email">Change my email address</label></span> <table class="PreferencesP-textboxes"> <tbody><tr> <td class="PreferencesP-label">Email:</td> <td><input type="text" class="PreferencesP-textbox email-field" id="pref-email" value="{{ viewer.account.user.email }}" autocomplete="email" disabled></td> </tr> <tr> <td class="PreferencesP-label">Repeat:</td> <td><input type="text" class="PreferencesP-textbox email-field" id="pref-email2" value="{{ viewer.account.user.email }}" autocomplete="email" disabled></td> </tr> <tr> <td class="PreferencesP-label">Password:</td> <td><input type="password" class="PreferencesP-textbox email-field" id="pref-password" autocomplete="current-password" disabled></td> </tr> </tbody></table> <button type="button" class="button PreferencesP-save" id="pref-save" data-action="save-preferences">Save</button></div>{% endif %}</div>
