{% for skill in skills %}<div class="ExistingSkillV-outer"><div class="ExistingSkillV-inner selectable" data-action="select-skill" data-skill-id="{{ skill.id }}" data-picture="{{ skill.picture.url }}"><div class="floatLeft"> <div class="ExistingSkillV-pictureOuter"> <img class="ExistingSkillV-pictureInner" alt="" src="{{ skill.picture.url }}"> </div> </div> <div class="ExistingSkillV-details2Inner"> <div class="floatLeft"> <div class="ExistingSkillV-title">{{ skill.title }}</div> <div class="ExistingSkillV-description">{{ skill.description.resource }}</div> {% if skill.show_source %}<div class="ExistingSkillV-descriptionLicense"><span class="ExistingSkillV-license">source: </span> <span class="ExistingSkillV-license">{{ skill.description.author_name|default:'' }}</span></div>{% endif %} </div> </div> <div class="stopFloat"></div> <div class="ExistingSkillV-mouseOverEffect"></div></div></div>{% endfor %}
