# Defaults of the chart. Everything that is specific to the cluster (registry,
# ingress, node selector, volumes, environment of the container) is not part of
# this repository: the pipeline adds it, see .pipeline/deploy.sh.

# The database is a file: more than one replica would corrupt it
replicaCount: 1

image:
    # Registry that the cluster pulls from
    registry: ""
    name: busyhumans
    # Replaces registry and name
    repository: ""
    pullPolicy: IfNotPresent
    # Set by the pipeline to the commit that it built
    tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
    create: true
    annotations: {}
    # If not set and create is true, the name of the release is used
    name: ""

podAnnotations: {}
# The image runs as this user. The volume has to be writable for it.
podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
securityContext:
    allowPrivilegeEscalation: false
    capabilities:
        drop: ["ALL"]

# The container listens on service.port
service:
    type: ClusterIP
    port: 8080

ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts: []
    #    - host: example.com
    #      paths:
    #          - path: /
    #            pathType: Prefix
    tls: []
    #    - secretName: example-com-tls
    #      hosts:
    #          - example.com

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}

# Environment of the container, same syntax as in a pod spec.
# Required: SECRET_KEY, ALLOWED_HOSTS and BASE_URL. See README.md for the rest.
env: []

# The cluster provides a volume with the name "data" in volumes. It holds the
# database file and the pictures.
volumeMounts:
    - name: data
      mountPath: /data
volumes: []

# Claim for the volume of the cluster
storageName: ""
storageClassName: ""
storageCapacity: "1Gi"
storageAccessMode: "ReadWriteOnce"
storageVolumeName: ""
